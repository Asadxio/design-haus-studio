<!-- ============ GA4 + CONVERSION EVENTS (replace G-XXXXXXX with your Measurement ID) ============ -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXX');
  // Track the things that make money: WhatsApp taps, phone taps, form submits
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var h = a.getAttribute('href') || '';
    if (h.indexOf('wa.me/') > -1) gtag('event', 'click_whatsapp', { link_url: h });
    else if (h.indexOf('tel:') === 0) gtag('event', 'click_call', { link_url: h });
    else if (h.indexOf('mailto:') === 0) gtag('event', 'click_email', { link_url: h });
  });
  // Call this inside your enquiry form's submit handler, after the lead is saved:
  // gtag('event', 'generate_lead', { service: selectedService, city: siteCity });
</script>
